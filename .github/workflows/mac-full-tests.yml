name: Mac platform regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            rid: osx-arm64
          - runner: macos-15-intel
            rid: osx-x64
          - runner: macos-26
            rid: osx-arm64
          - runner: macos-26-intel
            rid: osx-x64
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RID: ${{ matrix.rid }}
      TMPDIR: /private/tmp
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Get published application
        id: setup
        run: |
          gh release download mac-v0.3.2-beta --pattern "OmniZip-0.3.2-$RID-beta.zip" --pattern "OmniZip-0.3.2-$RID-beta.zip.sha256"
          shasum -a 256 -c "OmniZip-0.3.2-$RID-beta.zip.sha256"
          ditto -x -k "OmniZip-0.3.2-$RID-beta.zip" app
          mkdir -p results
      - name: Published package smoke check
        run: |
          set -o pipefail
          sw_vers | tee results/environment.txt
          uname -m | tee -a results/environment.txt
          codesign --verify --deep --strict app/OmniZip.app
          app/OmniZip.app/Contents/MacOS/OmniZip --self-test 2>&1 | tee results/published-app.txt
      - name: Native window startup
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          app/OmniZip.app/Contents/MacOS/OmniZip > results/native-window.txt 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          sleep 10
          kill -0 "$app_pid"
          screencapture -x results/native-window.png
          echo 'PASS native window startup' >> results/native-window.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-regression-${{ matrix.runner }}
          path: results/
          retention-days: 14
